pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'absolute-order'

include 'common'
include 'fabric'
// NeoForge dropped its 1.20.1 (47.1.x) artifacts from maven, so 1.20.1 ships Fabric + Forge. 'neoforge' is
// intentionally dropped (the dir is a stale scaffold leftover and is NOT included).
include 'forge'
