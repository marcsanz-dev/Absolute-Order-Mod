org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Publishable artifacts are "Absolute Order 2.0.0"; jar filenames encode loader + MC version.
mod_version = 2.0.0
maven_group = io.github.marcsanzdev
archives_name = AbsoluteOrder
# 1.20.1 ships Fabric + Forge (NeoForge dropped its 1.20.1 artifacts). Drives the common module's
# transformProduction<Platform> outputs, so both must be listed.
enabled_platforms = fabric,forge

# Minecraft — Phase 3 backport. 1.20.1 is the first render-era drop: E4 (GuiGraphics + PoseStack +
# RenderSystem), obfuscated era — the standard Architectury remap toolchain (Mojmap + Parchment, Java 17),
# unlike the no-remap 26.x ports.
minecraft_version = 1.20.1
parchment_version = 2023.09.03

# Dependencies (1.20.1 is a long-term modding target; all of these are stable releases).
architectury_api_version = 9.2.14
# fabric-api 0.92.11+1.20.1 requires loader 0.16.10+; 0.15.x fails mod resolution at launch.
fabric_loader_version = 0.16.14
fabric_api_version = 0.92.11+1.20.1
forge_version = 47.4.22
neoforge_version = 47.1.106

# Cloth Config (config screen) + ModMenu (Fabric config host).
cloth_config_version = 11.1.136
modmenu_version = 7.2.2

# Recipe-viewer compat (compile-only APIs; users provide the runtime mod).
emi_version = 1.1.22+1.20.1
rei_version = 12.1.785
