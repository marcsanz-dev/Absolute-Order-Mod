org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Absolute Order fork release: retain the upstream mod ID (chestseparators) for saved data compatibility.
# The suffix identifies this as a community-maintained fork, not the upstream 2.0.0 artifact.
mod_version = 2.1.0-fork.1
maven_group = io.github.marcsanzdev
archives_name = AbsoluteOrder
enabled_platforms = fabric

# Minecraft 26.3, Java 25, Architectury Loom no-remap.
minecraft_version = 26.3

# Fabric 26.3 dependency baseline. Keep this port Fabric-only until any other loader is tested.
architectury_api_version = 22.0.6
fabric_loader_version = 0.19.5
fabric_api_version = 0.165.2+26.3

# Fabric client dependencies (Cloth Config required, Mod Menu optional).
cloth_config_version = 26.3.159
modmenu_version = 21.0.1

# Optional recipe-viewer API used for GUI exclusion zones (compileOnly).
# EMI support is absent in the base 26.x source and is not added by this port.
rei_version = 26.3.824
