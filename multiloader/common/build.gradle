architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // Fabric Loader is used here only for the @Environment annotations and mixin dependencies; it is
    // remapped to the correct annotations on each platform. Do NOT use other Fabric Loader classes here.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Architectury API is wired in the next skeleton step:
    // modApi "dev.architectury:architectury:${rootProject.architectury_version}"
}
