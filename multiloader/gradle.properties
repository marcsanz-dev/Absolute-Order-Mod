# Loader / API versions (known-good for 1.21.11).
fabric_loader_version=0.19.3
fabric_api_version=0.141.2+1.21.11
neoforge_version=21.11.45

# architectury_version (the shared API) is wired in when the mod code migrates and starts using it.
