org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Publishable artifacts are "Absolute Order 2.0.0"; jar filenames encode loader + MC version.
mod_version = 2.0.0
maven_group = io.github.marcsanzdev
archives_name = AbsoluteOrder
enabled_platforms = fabric,neoforge

# Minecraft — target version.
minecraft_version = 1.21.11

# Dependencies. Toolchain style from generate.architectury.dev; loom bumped to 1.13-SNAPSHOT for 1.21.11.
# Architectury API dep is commented out in the platform files until its 1.21.11 version is pinned.
# architectury_api_version = <pin for 1.21.11>
fabric_loader_version = 0.19.3
fabric_api_version = 0.141.2+1.21.11
neoforge_version = 21.11.45
