org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Publishable artifacts are "Absolute Order 2.0.0"; jar filenames encode loader + MC version.
mod_version = 2.0.0
maven_group = io.github.marcsanzdev
archives_name = AbsoluteOrder
enabled_platforms = fabric,neoforge

# Minecraft — target version. Phase 2 forward port (render era E5, same overlay as the 1.21.11 reference).
# 26.1 "Tiny Takeover" line; 26.1.2 is the fully-toolchained patch (Fabric API / Architectury / Cloth /
# ModMenu / REI all publish for it). The jar's compat range covers 26.1 → 26.1.2.
minecraft_version = 26.1.2

# Dependencies (verified on Modrinth / maven, Aug 2026).
architectury_api_version = 20.0.12
fabric_loader_version = 0.19.3
fabric_api_version = 0.155.2+26.1.2
neoforge_version = 26.1.2.94

# Cloth Config (config screen) + ModMenu (Fabric config host).
cloth_config_version = 26.1.154
modmenu_version = 18.0.0

# Recipe-viewer compat (compile-only APIs; users provide the runtime mod). REI publishes a 26.1 build for
# BOTH loaders now, so REI-NeoForge can be wired here (unlike the 1.21.11 reference). EMI has no 26.1 build
# yet — compiled against its stable 1.21.1 API surface, same as the reference port.
emi_version = 1.1.24+1.21.1
rei_version = 26.1.819
