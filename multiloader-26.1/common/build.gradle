architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API (common).
    implementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Cloth Config API for the config screen — compile-only here; each platform ships the real impl.
    // The me.shedaniel.clothconfig2.api.* classes are platform-agnostic, so the Fabric artifact's API is
    // used to compile common. Exclude the fabric loader/api so nothing Fabric-specific leaks in.
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude group: "net.fabricmc"
        exclude group: "net.fabricmc.fabric-api"
    }

    // Recipe-viewer compat API — compile-only (users provide the runtime mod). REI ships a native 26.1
    // build for both loaders, so its exclusion-zone plugin lives in common and works everywhere.
    // EMI is intentionally DROPPED on 26.x: there is no EMI build for 26.x, and its 1.21.1 api jar leaks
    // intermediary names (class_437 = Screen) that do not resolve in the unobfuscated no-remap world.
    // Re-add ChestSeparatorsEmiPlugin + this dep once EMI publishes a 26.x artifact.
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:$rootProject.rei_version") {
        transitive = false
    }
}
