org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Publishable artifacts are "Absolute Order 2.0.0"; jar filenames encode loader + MC version.
mod_version = 2.0.0
maven_group = io.github.marcsanzdev
archives_name = AbsoluteOrder
# 1.19.2 ships Fabric + Forge (NeoForge did not exist pre-1.20.1). Drives common's transformProduction<Platform>.
enabled_platforms = fabric,forge

# Minecraft — Phase 3 backport, render era E2 (1.18.2): MatrixStack/DrawableHelper era. In Mojmap this is
# still PoseStack + GuiComponent statics + Font + ItemRenderer (same shape as E3), so the client/compat
# GuiGraphics shim carries over from 1.19.2; the drift is 1.18.2 mapping renames. Fabric + Forge only.
minecraft_version = 1.18.2
parchment_version = 2022.11.06

# Dependencies (1.18.2 line). Versions to be confirmed by the resolver; substitutes noted if any fail.
architectury_api_version = 4.12.94
fabric_loader_version = 0.16.14
fabric_api_version = 0.77.0+1.18.2
forge_version = 40.2.21

# Cloth Config (config screen) + ModMenu (Fabric config host) — 1.18.2 lines.
cloth_config_version = 6.5.116
modmenu_version = 3.2.5

# Recipe-viewer compat (compile-only APIs; users provide the runtime mod) — 1.18.2 lines.
emi_version = 0.7.5+1.18.2
rei_version = 8.4.737
