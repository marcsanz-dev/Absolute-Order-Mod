pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'absolute-order'

include 'common'
include 'fabric'
// NeoForge dropped its 1.20.1 (47.1.x) artifacts from maven, so 1.20.1 ships Fabric + Forge. The 'forge'
// module is created + included after the E4 overlay migration lands; 'neoforge' is intentionally dropped.
// include 'forge'
