org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Publishable artifacts are "Absolute Order 2.0.0"; jar filenames encode loader + MC version.
mod_version = 2.0.0
maven_group = io.github.marcsanzdev
archives_name = AbsoluteOrder
# 1.19.2 ships Fabric + Forge (NeoForge did not exist pre-1.20.1). Drives common's transformProduction<Platform>.
enabled_platforms = fabric,forge

# Minecraft — Phase 3 backport, render era E3 (1.19.2): early DrawContext era in Yarn terms, but in Mojmap
# there is NO GuiGraphics yet — rendering is PoseStack + GuiComponent static helpers (fill/blit) + Font +
# ItemRenderer. Standard Architectury remap toolchain (Mojmap + Parchment, Java 17). NeoForge did NOT exist
# pre-1.20.1, so this version is Fabric + Forge only.
minecraft_version = 1.19.2
parchment_version = 2022.11.27

# Dependencies (1.19.2 line). Versions to be confirmed by the resolver; substitutes noted if any fail.
architectury_api_version = 6.6.92
# 0.15.11's bundled mixin/ASM fails under the newer run JVM (ClassNotFoundException LambdaMetafactory while
# transforming Fabric API's crash-report mixin); 0.16.14 (as used on 1.20.1) bundles a newer mixin that works.
fabric_loader_version = 0.16.14
fabric_api_version = 0.77.0+1.19.2
forge_version = 43.3.13

# Cloth Config (config screen) + ModMenu (Fabric config host) — 1.19.2 lines.
cloth_config_version = 8.3.115
modmenu_version = 4.1.2

# Recipe-viewer compat (compile-only APIs; users provide the runtime mod) — 1.19.2 lines.
emi_version = 1.0.30+1.19.2
rei_version = 9.1.641
