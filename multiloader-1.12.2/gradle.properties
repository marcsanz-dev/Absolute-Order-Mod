# --- Absolute Order — 1.12.2 (Phase 4, mythic / Forge legacy, render era E1) ---
# Standalone ForgeGradle 2.3 project. Builds on JDK 11 (via the anatawa12 fork), targets Java 8 bytecode;
# the game itself runs on Java 8. Parchment does NOT exist for 1.12.2 — mappings are MCP snapshots.

mod_version = 2.0.0
minecraft_version = 1.12.2
# 2847 is the reliably-buildable 1.12.2 Forge: it publishes a -userdev artifact (2859/2860/2864 do NOT
# — their userdev jars 404 on the Forge maven, breaking ForgeGradle's dev workspace resolution).
forge_version = 14.23.5.2847
# Last 1.12.2 MCP snapshot (known-good). stable_39 is a 1.12 channel; this one is the .2 snapshot.
mcp_mappings = snapshot_20171003

# MixinBooter bundles CleanMix (a fork of SpongePowered Mixin 0.8.7) and bootstraps mixin configs from the
# jar's MixinConfigs manifest attribute — no hand-written coremod / IFMLLoadingPlugin / TweakClass needed.
mixinbooter_version = 11.13
# Mixin annotation processor (refmap generation) — matched to CleanMix's 0.8.x line.
mixin_ap_version = 0.8.5-SNAPSHOT
jei_version = 4.16.1.302

org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
