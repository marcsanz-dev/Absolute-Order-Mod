org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Publishable artifacts are "Absolute Order 2.0.0"; jar filenames encode loader + MC version.
mod_version = 2.0.0
maven_group = io.github.marcsanzdev
archives_name = AbsoluteOrder
# 1.16.5 ships Fabric + Forge (NeoForge did not exist). Drives common's transformProduction<Platform>.
enabled_platforms = fabric,forge

# Minecraft — Phase 3 backport, render era E2 (1.16.5): MatrixStack/AbstractGui era. In Mojmap this is still
# PoseStack + GuiComponent + Font + ItemRenderer (same shape as 1.18.2), so the client/compat GuiGraphics shim
# carries over; the drift is 1.16.5 mapping renames. CRITICAL: 1.16.5 runs on Java 8 (Forge 36.x requires it),
# so this whole module targets release 8 (see build.gradle) — records/var/switch-expressions are downgraded.
minecraft_version = 1.16.5
parchment_version = 2022.03.06

# Dependencies (1.16.5 line). Architectury API is the 1.x line here: package me.shedaniel.architectury.* (it was
# renamed to dev.architectury.* only in 2.x / MC 1.17+). Versions to be confirmed by the resolver.
architectury_api_version = 1.32.68
fabric_loader_version = 0.16.14
fabric_api_version = 0.42.0+1.16

forge_version = 36.2.42

# Cloth Config (config screen) + ModMenu (Fabric config host) — 1.16.5 lines.
cloth_config_version = 4.17.132
modmenu_version = 1.16.4

