pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'absolute-order'

include 'common'
include 'fabric'
// 1.19.2 ships Fabric + Forge (NeoForge did not exist pre-1.20.1; the 'neoforge' dir is a stale scaffold
// leftover and is NOT included).
include 'forge'
