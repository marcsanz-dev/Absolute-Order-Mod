plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        // Forge (mixin 0.8.4) registers mixin configs from the jar's MixinConfigs manifest attribute, which
        // loom only writes for configs declared here — Forge 1.16.5 does NOT honour mods.toml [[mixins]], so
        // without this the common config never registers and no mod mixin applies (vanilla chest, no editor).
        // 1.16.5 has no Forge-only mixin config (the renderSlotHighlight one doesn't exist this far back).
        mixinConfig "absoluteorder.mixins.json"
    }
}


configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    // Architectury API (Forge).
    modImplementation "me.shedaniel:architectury-forge:$rootProject.architectury_api_version"

    // Cloth Config (Forge) — the real config-screen impl for the ConfigScreenHandler registration.
    modImplementation "me.shedaniel.cloth:cloth-config-forge:$rootProject.cloth_config_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    // Publishable name: AbsoluteOrder-2.0.0-forge-mc<version>.jar
    archiveClassifier = "forge-mc${rootProject.minecraft_version}"
}
