plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API (NeoForge).
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Cloth Config (NeoForge) — the real config-screen impl for the IConfigScreenFactory registration.
    implementation "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"

    // REI (NeoForge) — compile-only API. NeoForge discovers REI plugins via the @REIPluginClient annotation
    // (its forge/neoforge variant), so NeoForgeReiPlugin here annotates the common REIClientPlugin. REI ships
    // a native 26.1 build for NeoForge, so this compiles cleanly (unlike EMI, dropped on 26.x).
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:$rootProject.rei_version") { transitive = false }

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

// No-remap era (MC 26.x, unobfuscated): there is no remapJar. Loom processes the base `jar` (classifier
// 'raw'); shadowJar then unpacks it and bundles the transformed common classes into the publishable jar
// AbsoluteOrder-2.0.0-neoforge-mc<version>.jar.
jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from zipTree(jar.archiveFile)
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-mc${rootProject.minecraft_version}"
}

// The publishable jar is the shadowJar (bundles common); make `build`/`assemble` produce it.
tasks.named('assemble') { dependsOn tasks.named('shadowJar') }
