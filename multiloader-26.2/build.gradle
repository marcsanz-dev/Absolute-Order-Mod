plugins {
    // Phase 2 (26.x) toolchain: MC 26.1 is the first UNOBFUSCATED Minecraft. architectury-loom 1.17 ships a
    // dedicated `-no-remap` plugin for this era — the game jar already carries real names, so nothing is
    // remapped and there are no Mojang mappings to declare (see the loom neoforge/261 test project).
    id 'dev.architectury.loom-no-remap' version '1.17.491' apply false
    id 'architectury-plugin' version '3.5.169'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Publishable jars are "Absolute Order 2.0.0"; loader + MC version go in the remapJar classifier.
        archivesName = rootProject.archives_name
    }

    repositories {
        // Cloth Config (config screen) and ModMenu (Fabric config host).
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
    }

    dependencies {
        // MC 26.x ships as an UNOBFUSCATED jar under the com.mojang coordinate, carrying real Mojang names
        // (and Parchment-style parameter names) directly — Mojang no longer publishes obfuscation mappings,
        // so there is no `mappings` dependency to declare (loom uses the jar's names as-is).
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
