org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Publishable artifacts are "Absolute Order 2.0.0"; jar filenames encode loader + MC version.
mod_version = 2.0.0
maven_group = io.github.marcsanzdev
archives_name = AbsoluteOrder
enabled_platforms = fabric,neoforge

# Minecraft — target version. Phase 2, MC 26.2 "Chaos Cubed" (render era E5, same unobfuscated no-remap
# toolchain as the 26.1 port — Java 25, architectury-loom 1.17 -no-remap, Gradle 9.4).
minecraft_version = 26.2

# Dependencies (verified on Modrinth / maven, Aug 2026).
architectury_api_version = 21.0.6
fabric_loader_version = 0.19.3
fabric_api_version = 0.156.0+26.2
# 26.2.0.39-beta is the latest NeoForge 26.2 beta still compatible with architectury 21.0.6: .40-beta
# removed the ContainerScreenEvent.Render.Foreground event that architectury-neoforge 21.0.6 references
# (NoClassDefFoundError otherwise). Bump once a newer architectury targets the latest NeoForge 26.2 beta.
neoforge_version = 26.2.0.39-beta

# Cloth Config (config screen) + ModMenu (Fabric config host).
cloth_config_version = 26.2.155
modmenu_version = 20.0.1

# Recipe-viewer compat (compile-only APIs; users provide the runtime mod). REI ships a native 26.2 build for
# BOTH loaders. EMI still has no 26.x build — compiled against its stable 1.21.1 API surface (as on 26.1).
emi_version = 1.1.24+1.21.1
rei_version = 26.2.820
